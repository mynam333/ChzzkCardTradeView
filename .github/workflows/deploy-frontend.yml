name: Deploy Frontend

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api.yuaru.com/api' }}
      NEXT_PUBLIC_CHAT_WS_URL: ${{ secrets.NEXT_PUBLIC_CHAT_WS_URL || vars.NEXT_PUBLIC_CHAT_WS_URL || 'wss://api.yuaru.com/chat' }}
      NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ENABLED || vars.NEXT_PUBLIC_ANALYTICS_ENABLED || 'true' }}
      NEXT_PUBLIC_ANALYTICS_ALLOW_LOCALHOST: 'false'
      NEXT_PUBLIC_ANALYTICS_HEARTBEAT_MS: ${{ secrets.NEXT_PUBLIC_ANALYTICS_HEARTBEAT_MS || vars.NEXT_PUBLIC_ANALYTICS_HEARTBEAT_MS || '60000' }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check site insights build env
        run: |
          node -e "console.log('[site-insights]', { analyticsEnabled: process.env.NEXT_PUBLIC_ANALYTICS_ENABLED || '', allowLocalhost: process.env.NEXT_PUBLIC_ANALYTICS_ALLOW_LOCALHOST || '', heartbeatMs: process.env.NEXT_PUBLIC_ANALYTICS_HEARTBEAT_MS || '' })"

      - name: Build frontend
        run: pnpm --filter frontend build
        env:
          DEPLOY_TARGET: cloudflare-pages

      - name: Verify Cloudflare Pages settings
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          pnpm dlx wrangler@latest pages deploy frontend/out \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
