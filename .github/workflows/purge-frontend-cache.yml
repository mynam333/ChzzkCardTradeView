name: Purge Frontend Page Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-retired-page:
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Invalidate cached copies of the retired page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          async function api(path, body) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
              throw new Error(`Cloudflare HTTP ${response.status}: ${(data.errors || []).map(e => `${e.code}: ${e.message}`).join('; ')}`);
            }
            return data.result;
          }
          (async () => {
            if (!token) throw new Error('Deployment token is unavailable');
            const zones = await api('/zones?name=yuaru.com');
            const zone = zones.find(z => z.name === 'yuaru.com');
            if (!zone) throw new Error('The deployment token cannot access the site zone');
            const files = ['https://chikapo.yuaru.com/arena', 'https://chikapo.yuaru.com/arena/', 'https://chikapo.yuaru.com/arena.html'];
            await api(`/zones/${zone.id}/purge_cache`, { files });
            console.log('PURGE_RESULT=success; retired page URLs purged');
          })().catch(error => {
            console.error(`PURGE_RESULT=unavailable; ${error.message}`);
            console.error('Zone cache-purge access or a dashboard login is required. No cache purge was completed.');
            process.exitCode = 1;
          });
          NODE
